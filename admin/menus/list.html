<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 - 메뉴 목록</title>
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="./list.css" />
    <link rel="stylesheet" href="../layout.css" />
  </head>
  <body>
    <div class="page-shell admin-shell">
      <aside class="admin-sidebar" aria-label="관리자 메뉴">
        <a class="admin-brand" href="../index.html">
          <span class="admin-brand-mark">C</span>
          <span class="admin-brand-name">Cafe Admin</span>
          <span class="admin-brand-meta">Specialty operations</span>
        </a>
        <nav class="admin-nav">
          <p class="admin-nav-label">Workspace</p>
          <a class="admin-nav-link" href="../index.html">대시보드</a>
          <a class="admin-nav-link is-active" href="./list.html">메뉴 관리</a>
          <a class="admin-nav-link" href="../orders/list.html">주문 관리</a>
        </nav>
        <div class="admin-sidebar-footer">
          <a class="admin-nav-link" href="../../index.html">고객 화면</a>
        </div>
      </aside>

      <div class="admin-main">
        <header class="admin-header">
          <nav class="admin-breadcrumb" aria-label="Breadcrumb">
            <span>Admin</span>
            <span>메뉴 관리</span>
          </nav>
          <div class="admin-header-row">
            <div>
              <p class="eyebrow">Menu Management</p>
              <h1>메뉴 관리</h1>
            </div>
            <div class="admin-header-actions">
              <a class="primary-link" href="./create.html">새 메뉴 등록</a>
            </div>
          </div>
        </header>

        <main class="container page-content admin-content">
          <section class="summary-grid">
            <article class="summary-card glass">
              <span>전체 메뉴</span>
              <strong id="totalCount">0</strong>
            </article>
            <article class="summary-card glass">
              <span>판매 중</span>
              <strong id="activeCount">0</strong>
            </article>
            <article class="summary-card glass">
              <span>품절</span>
              <strong id="soldOutCount">0</strong>
            </article>
          </section>

          <section class="filter-panel glass">
            <div class="filter-head">
              <div>
                <p class="panel-eyebrow">Browse</p>
                <h2>필터와 보기 방식</h2>
              </div>
              <div class="view-toggle" role="tablist" aria-label="메뉴 보기 방식">
                <button
                  class="view-button is-active"
                  id="cardViewButton"
                  type="button"
                  data-view="card"
                  aria-controls="menuList"
                  aria-selected="true"
                >
                  카드
                </button>
                <button
                  class="view-button"
                  id="tableViewButton"
                  type="button"
                  data-view="table"
                  aria-controls="menuTableShell"
                  aria-selected="false"
                >
                  표
                </button>
              </div>
            </div>

            <div class="filter-grid">
              <label class="field">
                <span>카테고리</span>
                <select id="categoryFilter"></select>
              </label>

              <label class="field field-search">
                <span>검색</span>
                <input id="keywordInput" type="search" placeholder="메뉴명 또는 설명 검색" />
              </label>
            </div>
          </section>

          <section class="list-panel" id="menuListPanel" data-view="card">
            <div class="list-header">
              <div>
                <h2>메뉴 목록</h2>
                <p id="resultText">총 0개</p>
              </div>
            </div>

            <div id="menuList" class="menu-list is-visible"></div>

            <div class="menu-table-shell glass is-hidden" id="menuTableShell" hidden>
              <table class="menu-table">
                <thead>
                  <tr>
                    <th>메뉴</th>
                    <th>카테고리</th>
                    <th>가격</th>
                    <th>상태</th>
                    <th>이미지</th>
                    <th>작업</th>
                  </tr>
                </thead>
                <tbody id="menuTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="../../js/data.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="./list.js"></script>
  </body>
</html>
