<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - Mellow Yard Coffee</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="subpage-with-gnb subpage-with-ambient">
  <div class="page-ambient" aria-hidden="true">
    <span class="ambient-wave ambient-wave-a"></span>
    <span class="ambient-wave ambient-wave-b"></span>
    <span class="ambient-wave ambient-wave-c"></span>
    <span class="ambient-shimmer"></span>
  </div>

  <header class="site-header site-header-subpage">
    <a class="brand-mark" href="../index.html" aria-label="Mellow Yard Coffee 홈">
      <span class="brand-symbol" aria-hidden="true">MY</span>
      <span>
        <strong>Mellow Yard</strong>
        <small>Specialty Coffee</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="주요 메뉴">
      <a class="site-nav-link" href="../index.html">Home</a>
      <a class="site-nav-link" href="../menus/list.html">Menu</a>
      <a class="site-nav-link" href="../orders/list.html">Orders</a>
      <a class="site-nav-link" href="../my/index.html">My</a>
    </nav>

    <a href="../basket/list.html" class="cart-link" aria-label="장바구니">
      <span aria-hidden="true">Basket</span>
      <span class="cart-badge" data-cart-badge hidden>0</span>
    </a>
  </header>

  <header class="page-header glass">
    <a href="../my/index.html" class="icon-btn" aria-label="마이페이지로 이동">←</a>
    <h1>로그인</h1>
    <span class="icon-btn page-header-spacer" aria-hidden="true"></span>
  </header>

  <main class="auth-page container">
    <section class="auth-card glass" aria-labelledby="loginTitle">
      <div class="auth-copy">
        <p class="auth-eyebrow">Member Access</p>
        <h2 id="loginTitle">아이디와 비밀번호로 이어서 이용하세요.</h2>
        <p>회원가입으로 만든 계정으로 로그인하면 주문, 찜, 장바구니가 계정 기준으로 이어집니다.</p>
      </div>

      <form class="auth-form" id="loginForm">
        <label class="form-field" for="loginId">
          <span>아이디</span>
          <input id="loginId" class="form-control" name="loginId" type="text" autocomplete="username" placeholder="예: mellowyard" required />
          <small>회원가입할 때 만든 아이디를 입력하세요.</small>
        </label>

        <label class="form-field" for="loginPassword">
          <span>비밀번호</span>
          <input id="loginPassword" class="form-control" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required />
          <small>현재는 프론트엔드 테스트용 계정 인증입니다.</small>
        </label>

        <p class="auth-error" id="loginError" role="alert" hidden></p>

        <button class="primary-button auth-submit" type="submit">로그인하기</button>
      </form>
    </section>
  </main>

  <nav class="mobile-nav glass" aria-label="모바일 주요 메뉴">
    <a href="../index.html">Home</a>
    <a href="../menus/list.html">Menu</a>
    <a href="../orders/list.html">Orders</a>
    <a class="active" href="../my/index.html">My</a>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="login.js"></script>
</body>
</html>
