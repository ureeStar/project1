<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>장바구니 - Mellow Yard Coffee</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="list.css" />
</head>
<body class="subpage-with-gnb">
  <header class="site-header site-header-subpage">
    <a class="brand-mark" href="../index.html" aria-label="Mellow Yard Coffee 홈">
      <span class="brand-symbol" aria-hidden="true">MY</span>
      <span>
        <strong>Mellow Yard</strong>
        <small>Specialty Coffee</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="주요 메뉴">
      <a class="site-nav-link" href="../index.html">Home</a>
      <a class="site-nav-link" href="../menus/list.html">Menu</a>
      <a class="site-nav-link" href="../orders/list.html">Orders</a>
      <a class="site-nav-link" href="../my/index.html">My</a>
    </nav>

    <a href="../basket/list.html" class="cart-link" aria-label="장바구니">
      <span aria-hidden="true">Basket</span>
      <span class="cart-badge" data-cart-badge hidden>0</span>
    </a>
  </header>

  <header class="page-header">
    <a href="../menus/list.html" class="icon-btn" aria-label="메뉴로">‹</a>
    <a class="header-brand" href="../index.html">
      <strong>Mellow Yard</strong>
      <span>Basket</span>
    </a>
    <button class="icon-btn" id="clearCartBtn" type="button" aria-label="장바구니 비우기">×</button>
  </header>

  <main class="basket-page container">
    <section class="page-intro" aria-labelledby="basketTitle">
      <p class="section-kicker">Ready to order</p>
      <h1 id="basketTitle">장바구니를 확인하고 바로 주문하세요</h1>
      <p>수량을 조정하고 필요 없는 메뉴를 바로 정리할 수 있도록 구성했습니다.</p>
    </section>

    <section class="basket-layout">
      <div class="basket-main">
        <section class="basket-summary" id="basketSummary" aria-label="장바구니 요약">
          <div class="summary-card">
            <span class="summary-label">담긴 메뉴</span>
            <strong class="summary-value" id="summaryCount">0개</strong>
          </div>
          <div class="summary-card">
            <span class="summary-label">예상 결제 금액</span>
            <strong class="summary-value" id="summaryPrice">0원</strong>
          </div>
        </section>

        <section id="basketContent" aria-live="polite"></section>
      </div>
    </section>
  </main>

  <nav class="mobile-nav glass" aria-label="모바일 주요 메뉴">
    <a href="../index.html">Home</a>
    <a href="../menus/list.html">Menu</a>
    <a href="../orders/list.html">Orders</a>
    <a href="../my/index.html">My</a>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="list.js"></script>
</body>
</html>
