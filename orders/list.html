<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주문 내역 - 카페 앱</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="list.css" />
</head>
<body>
  <header class="page-header glass">
    <a href="../index.html" class="icon-btn" aria-label="홈으로 이동">←</a>
    <h1>주문 내역</h1>
    <a href="../basket/list.html" class="icon-btn cart-btn" aria-label="장바구니">
      🛒
      <span class="cart-badge" id="cartBadge" hidden>0</span>
    </a>
  </header>

  <main class="container">
    <section class="orders-hero glass" aria-label="주문 상태 안내">
      <div class="orders-hero-copy">
        <p class="orders-hero-eyebrow">Order Tracking</p>
        <h2 class="orders-hero-title">현재 주문 상태를 빠르게 확인하세요.</h2>
        <p class="orders-hero-text">최근 주문부터 접수, 제조, 픽업 완료 상태를 한눈에 볼 수 있습니다.</p>
      </div>
      <div class="orders-status-legend" aria-hidden="true">
        <span class="order-status status-received">접수</span>
        <span class="order-status status-making">제조중</span>
        <span class="order-status status-ready">준비완료</span>
        <span class="order-status status-picked">픽업완료</span>
      </div>
    </section>

    <div class="order-list" id="orderList"></div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="list.js"></script>
</body>
</html>
