<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주문 내역 - 카페 앱</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="list.css" />
</head>
<body class="subpage-with-gnb subpage-with-ambient">
  <div class="page-ambient" aria-hidden="true">
    <span class="ambient-wave ambient-wave-a"></span>
    <span class="ambient-wave ambient-wave-b"></span>
    <span class="ambient-wave ambient-wave-c"></span>
    <span class="ambient-shimmer"></span>
  </div>
  <header class="site-header site-header-subpage">
    <a class="brand-mark" href="../index.html" aria-label="Mellow Yard Coffee 홈">
      <span class="brand-symbol" aria-hidden="true">MY</span>
      <span>
        <strong>Mellow Yard</strong>
        <small>Specialty Coffee</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="주요 메뉴">
      <a class="site-nav-link" href="../index.html">Home</a>
      <a class="site-nav-link" href="../menus/list.html">Menu</a>
      <a class="site-nav-link active" href="./list.html" aria-current="page">Orders</a>
      <a class="site-nav-link" href="../my/index.html">My</a>
    </nav>

    <a href="../basket/list.html" class="cart-link" aria-label="장바구니">
      <span aria-hidden="true">Basket</span>
      <span class="cart-badge" data-cart-badge hidden>0</span>
    </a>
  </header>

  <header class="page-header glass">
    <a href="../index.html" class="icon-btn" aria-label="홈으로 이동">←</a>
    <h1>주문 내역</h1>
    <span class="icon-btn page-header-spacer" aria-hidden="true"></span>
  </header>

  <main class="container">
    <section class="orders-hero glass" aria-label="주문 상태 안내">
      <div class="orders-hero-copy">
        <p class="orders-hero-eyebrow">Order Tracking</p>
        <h2 class="orders-hero-title">현재 주문 상태를 빠르게 확인하세요.</h2>
        <p class="orders-hero-text">최근 주문부터 접수, 제조, 픽업 완료 상태를 한눈에 볼 수 있습니다.</p>
      </div>
      <div class="orders-status-legend" aria-hidden="true">
        <span class="order-status status-received">접수</span>
        <span class="order-status status-making">제조중</span>
        <span class="order-status status-ready">준비완료</span>
        <span class="order-status status-picked">픽업완료</span>
      </div>
    </section>

    <div class="order-list" id="orderList"></div>
    <nav class="pagination" id="orderPagination" aria-label="주문 내역 페이지"></nav>
  </main>

  <nav class="mobile-nav glass" aria-label="모바일 주요 메뉴">
    <a href="../index.html">Home</a>
    <a href="../menus/list.html">Menu</a>
    <a class="active" href="./list.html" aria-current="page">Orders</a>
    <a href="../my/index.html">My</a>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="list.js"></script>
</body>
</html>
